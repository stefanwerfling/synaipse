name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · build · test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor (node:sqlite without flag), 24 is current LTS.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run bundle:check
      - run: npm run eval

  mariadb:
    name: server-mode integration (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.7
        env:
          MARIADB_DATABASE: synaipse
          MARIADB_USER: synaipse
          MARIADB_PASSWORD: synaipse
          MARIADB_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SYNAIPSE_TEST_MARIADB: '1'
      SYNAIPSE_TEST_MARIADB_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx vitest run packages/server-storage
